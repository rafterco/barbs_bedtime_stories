name: barbs_bedtime_stories
description: Barbara's Bedtime Stories — Gentle stories for sweet dreams.
publish_to: 'none'
version: 1.3.19+32

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.13.0
  cloud_firestore: ^5.6.7
  firebase_auth: ^5.5.3
  firebase_storage: ^12.4.5

  # Audio
  just_audio: ^0.9.43
  audio_video_progress_bar: ^2.0.3
  audio_service: ^0.18.17
  audio_session: ^0.1.25
  video_player: ^2.9.2
  rxdart: ^0.28.0

  # UI
  flutter_svg: ^2.0.17
  google_nav_bar: ^5.0.7
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  marquee: ^2.2.3

  # Navigation
  go_router: ^14.8.1

  # State Management
  flutter_riverpod: ^2.6.1

  # Utilities
  cupertino_icons: ^1.0.8
  path_provider: ^2.1.5
  wakelock_plus: ^1.2.10
  flutter_cache_manager: ^3.4.1
  share_plus: ^10.1.4
  fluttertoast: ^8.2.12
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audio/ambient/
